name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every 6 hours, so the Get it page's download counter stays current (scripts/render-downloads.mjs).
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Build and deploy are separate jobs (GitHub's Pages template): the artifact is finalised
  # before deploy-pages looks for it. In one job it sometimes found "0 artifacts".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Reads demios-desktop's public release statistics and renders the counter into the page.
      # Nothing is committed; the numbers exist only in this build's artifact.
      - name: Render download counts
        run: node scripts/render-downloads.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check the built site
        run: node scripts/check-site.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
